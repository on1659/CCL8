// ============================================================
//  기하 — reference에서 그대로 (검증 완료된 코드)
// ============================================================
function raySeg(px,pz,dx,dz,s){
  const sx=s.x2-s.x1, sz=s.z2-s.z1;
  const den=dx*sz-dz*sx;
  if(Math.abs(den)<1e-9) return Infinity;
  const t=((s.x1-px)*sz-(s.z1-pz)*sx)/den;
  const u=((s.x1-px)*dz-(s.z1-pz)*dx)/den;
  return (t>1e-4 && u>=0 && u<=1) ? t : Infinity;
}
// 원-선분 밀어내기: 이 게임의 유일한 충돌이다
function collideCircle(o){
  for(let k=0;k<walls.length;k++){
    const s=walls[k];
    const vx=s.x2-s.x1, vz=s.z2-s.z1;
    const wx=o.x-s.x1, wz=o.z-s.z1;
    const L2=vx*vx+vz*vz;
    let t=L2>0 ? (wx*vx+wz*vz)/L2 : 0;
    t=Math.max(0,Math.min(1,t));
    const cx=s.x1+vx*t, cz=s.z1+vz*t;
    let dx=o.x-cx, dz=o.z-cz;
    const d=Math.hypot(dx,dz);
    if(d<o.r+2 && d>1e-6){ const push=(o.r+2-d); o.x+=dx/d*push; o.z+=dz/d*push; }
    else if(d<=1e-6){ o.x+=0.5; }
  }
}
function moveToward(o,tx,tz,step){
  const dx=tx-o.x, dz=tz-o.z, d=Math.hypot(dx,dz);
  if(d<1e-4) return 0;
  const s=Math.min(step,d);
  o.x+=dx/d*s; o.z+=dz/d*s;
  return d;
}
// 두 점 사이가 벽에 막혔나 (닭이 문을 찾아야 하는지 판단용)
function lineBlocked(ax,az,bx,bz){
  const dx=bx-ax, dz=bz-az, L=Math.hypot(dx,dz);
  if(L<1e-4) return false;
  const ux=dx/L, uz=dz/L;
  for(let k=0;k<walls.length;k++){
    const t=raySeg(ax,az,ux,uz,walls[k]);
    if(t>4 && t<L-2) return true;
  }
  return false;
}

// 선분 → 박스. 선분이 중심선이고 두께 4는 충돌 밀어내기(r+2)와 맞물린다
function segBox(s,h,material){
  const dx=s.x2-s.x1, dz=s.z2-s.z1;
  const len=Math.hypot(dx,dz);
  const m=new THREE.Mesh(new THREE.BoxGeometry(len+4,h,5),material);
  m.position.set((s.x1+s.x2)/2, h/2, (s.z1+s.z2)/2);
  m.rotation.y=-Math.atan2(dz,dx);
  return m;
}
// 울타리는 통짜 벽이 아니라 기둥+가로대다 — 너머가 보여야 "저기 계란 있다"가 읽힌다
function fenceRun(s){
  const g=new THREE.Group();
  const dx=s.x2-s.x1, dz=s.z2-s.z1;
  const len=Math.hypot(dx,dz), ang=-Math.atan2(dz,dx);
  const H=SEG_H.fence;
  for(const y of [H*0.46,H*0.88]){
    const rail=new THREE.Mesh(new THREE.BoxGeometry(len,5,4),MAT.fence);
    rail.position.set((s.x1+s.x2)/2,y,(s.z1+s.z2)/2);
    rail.rotation.y=ang; g.add(rail);
  }
  const n=Math.max(2,Math.round(len/46));
  for(let i=0;i<=n;i++){
    const t=i/n;
    const p=new THREE.Mesh(new THREE.BoxGeometry(7,H,7),MAT.fence);
    p.position.set(s.x1+dx*t,H/2,s.z1+dz*t); g.add(p);
  }
  return g;
}

  scene.add(segBox(s,SEG_H[s.kind],MAT[s.kind]||MAT.wall));
}

let AC=null, master=null, NOISE=null, muted=false;
function initAudio(){
  if(AC) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
    NOISE=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=NOISE.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }catch(e){}
}
function blip(freq,dur,gain,type){
  if(!AC||muted) return;
  const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
  o.type=type||'sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(gain,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
}
function noiseHit(dur,gain,f0,f1){
  if(!AC||muted) return;
  const s=AC.createBufferSource(); s.buffer=NOISE; s.loop=true;
  const bp=AC.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value=(f0+f1)/2; bp.Q.value=0.8;
  const g=AC.createGain(), t=AC.currentTime;
  g.gain.setValueAtTime(gain,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t+dur+0.03);
}

function freeEgg(){
  for(let i=0;i<eggs.length;i++) if(eggs[i].state==='gone') return eggs[i];
  return null;
}
function spawnEggAt(nestIdx){
  const e=freeEgg(); if(!e) return null;
  const n=nests[nestIdx];
  e.state='rest'; e.nest=nestIdx;
  e.x=n.x; e.z=n.z; e.y=EGG_R;

  e.mesh.visible=true;
  return e;
}
function nestOccupied(i){
  for(let k=0;k<eggs.length;k++)
    if(eggs[k].state==='rest' && Math.hypot(eggs[k].x-nests[i].x,eggs[k].z-nests[i].z)<20) return true;
  return false;
}
function breakEgg(e){
  e.state='gone'; e.mesh.visible=false;
  stats.broken++;
  addSplat(e.x,e.z);
  burst(e.x,6,e.z,26,COL_YOLK,16,0.9,7);
  burst(e.x,10,e.z,16,COL_SHELL,22,0.7,4);
  crackS();
  shake=Math.max(shake,0.35);
}
function deliverEgg(e){
  e.state='gone'; e.mesh.visible=false;
  stats.delivered++;
  drawSign();
  for(let i=0;i<deliveredMesh.length;i++) deliveredMesh[i].visible=(i<stats.delivered);
  burst(truckPad.x,20,truckPad.z,24,[1,0.9,0.55],26,1.0,6);
  dingS();
  if(stats.delivered>=NEED_EGGS) win();
}
function inPad(x,z){ return Math.hypot(x-truckPad.x,z-truckPad.z)<truckPad.r; }

function tryPickOrPlace(){
  if(phase!=='play'||player.stun>0) return;
  if(held){                                  // 살살 내려놓기 — 절대 안 깨진다
    const fx=-Math.sin(yaw), fz=-Math.cos(yaw);
    const t={x:player.x+fx*22, z:player.z+fz*22, r:EGG_R+2};
    collideCircle(t);
    held.x=t.x; held.z=t.z; held.y=EGG_R;
    held.vx=held.vy=held.vz=0;
    held.state='rest'; held=null;
    placeS();
    return;
  }
  let best=null, bd=PICK_R;
  for(const e of eggs){
    if(e.state!=='rest') continue;
    const d=Math.hypot(e.x-player.x,e.z-player.z);
    if(d<bd){ bd=d; best=e; }
  }
  if(!best) return;
  held=best; best.state='held';
  if(best.nest>=0){ nests[best.nest].cd=NEST_RESPAWN; best.nest=-1; }
  pickS();
  alarm();                                   // 남의 알을 집으면 주인이 안다
}
function throwEgg(pw){
  if(!held) return;
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  let dx=-Math.sin(yaw)*cp, dy=sp, dz=-Math.cos(yaw)*cp;
  dy+=THROW_LIFT;
  const l=Math.hypot(dx,dy,dz)||1; dx/=l; dy/=l; dz/=l;
  const v=THROW_MIN+(THROW_MAX-THROW_MIN)*pw;
  const e=held; held=null;
  e.state='fly';
  e.x=player.x+dx*18; e.z=player.z+dz*18; e.y=CARRY_H;
  e.vx=dx*v; e.vy=dy*v; e.vz=dz*v;
  whipS(pw);
  alarm();
}
function updEggs(dt){
  for(const e of eggs){
    if(e.state==='rest'){
      if(inPad(e.x,e.z)) deliverEgg(e);
      continue;
    }
    if(e.state!=='fly') continue;
    e.spin+=dt*10;
    const ox=e.x, oy=e.y, oz=e.z;
    e.vy-=EGG_G*dt;
    e.x+=e.vx*dt; e.y+=e.vy*dt; e.z+=e.vz*dt;
    const soft=inPad(e.x,e.z);               // 짚 깔린 짐칸 — 세게 던져도 안 깨진다

    // 벽 충돌: 이번 프레임의 평면 경로가 선분을 가로지르고, 그 높이가 벽보다 낮으면 명중
    const mdx=e.x-ox, mdz=e.z-oz, mlen=Math.hypot(mdx,mdz);
    let hit=null;
    if(mlen>1e-6){
      const ux=mdx/mlen, uz=mdz/mlen;
      let bt=Infinity, bs=null;
      for(let k=0;k<walls.length;k++){
        const s=walls[k];
        const t=raySeg(ox,oz,ux,uz,s);
        if(t<=mlen && t<bt){
          const hy=oy+(e.y-oy)*(t/mlen);
          if(hy<SEG_H[s.kind]){ bt=t; bs=s; }
        }
      }
      if(bs) hit={t:bt,s:bs,ux,uz};
    }
    if(hit){
      const spd=Math.hypot(e.vx,e.vy,e.vz);
      e.x=ox+hit.ux*Math.max(0,hit.t-4); e.z=oz+hit.uz*Math.max(0,hit.t-4);
      if(spd>EGG_BREAK_SPD && !soft){ breakEgg(e); continue; }
      // 선분 법선으로 반사
      const sx=hit.s.x2-hit.s.x1, sz=hit.s.z2-hit.s.z1;
      const sl=Math.hypot(sx,sz)||1;
      const nx=-sz/sl, nz=sx/sl;
      const d=e.vx*nx+e.vz*nz;
      e.vx-=2*d*nx; e.vz-=2*d*nz;
      e.vx*=EGG_REST+0.2; e.vz*=EGG_REST+0.2;
      thudS();
      burst(e.x,e.y,e.z,4,COL_DUST,6,0.4,3);
    }
    if(e.y<=EGG_R){
      const spd=Math.hypot(e.vx,e.vy,e.vz);
      e.y=EGG_R;
      if(spd>EGG_BREAK_SPD && !soft){ breakEgg(e); continue; }
      e.vy=-e.vy*EGG_REST; e.vx*=EGG_FRIC; e.vz*=EGG_FRIC;
      if(spd>90){ thudS(); burst(e.x,3,e.z,5,COL_DUST,8,0.45,3); }
      if(e.vy<70 && Math.hypot(e.vx,e.vz)<40){
        e.vx=e.vy=e.vz=0; e.state='rest';
        if(inPad(e.x,e.z)) deliverEgg(e);
      }
    }
  }
}
function updNests(dt){
  for(let i=0;i<nests.length;i++){
    if(nests[i].cd<=0) continue;
    nests[i].cd-=dt;
    if(nests[i].cd<=0 && !nestOccupied(i)){
      const e=spawnEggAt(i);
      if(e) burst(e.x,10,e.z,10,COL_FEATHER,12,0.7,4);
    }
  }
}

function pickWander(c){
  for(let k=0;k<10;k++){
    const x=COOP.x0+Math.random()*(COOP.x1-COOP.x0);
    const z=COOP.z0+Math.random()*(COOP.z1-COOP.z0);
    if(x>SHED.x0&&x<SHED.x1&&z>SHED.z0&&z<SHED.z1) continue;
    c.tx=x; c.tz=z; c.t=2.2+Math.random()*2.6; return;
  }
  c.tx=c.hx; c.tz=c.hz; c.t=2.5;
}
// 길찾기는 없다. 울타리 반대편이 목적지면 문 하나를 경유한다 (나갈 때도, 돌아올 때도)
const _nav={x:0,z:0};
function navTo(c,tx,tz){
  const cIn=c.x>FENCE_X, tIn=tx>FENCE_X;
  if(cIn!==tIn && lineBlocked(c.x,c.z,tx,tz)){
    let d=cIn?DOOR_IN:DOOR_OUT;
    if(Math.hypot(c.x-d.x,c.z-d.z)<20) d=cIn?DOOR_OUT:DOOR_IN;  // 문턱에 붙었으면 반대편으로 통과
    _nav.x=d.x; _nav.z=d.z;
  } else { _nav.x=tx; _nav.z=tz; }
  return _nav;
}
function alarm(){
  for(const c of chickens){
    if(c.state==='chase') continue;
    if(Math.hypot(c.x-player.x,c.z-player.z)<CHK_HEAR_R){
      c.state='chase'; c.react=CHK_REACT; c.t=0;
      squawkS();
    }
  }
}
function onCaught(c){
  stats.caught++;
  player.stun=STUMBLE_T; player.invuln=STUMBLE_T+INVULN_T;
  shake=1; flash=1;
  if(held){
    // 몸이 튕기면서 손에 있던 게 날아간다 — 깨질지 말지는 각도 나름
    const a=Math.random()*TAU;
    const sp=140+Math.random()*120;
    held.state='fly';
    held.x=player.x; held.z=player.z; held.y=CARRY_H;
    held.vx=Math.cos(a)*sp; held.vz=Math.sin(a)*sp;
    held.vy=150+Math.random()*150;
    held=null;
  }
  burst(c.x,26,c.z,34,COL_FEATHER,26,1.5,6);
  burst(player.x,20,player.z,14,COL_DUST,20,0.9,5);
  caughtS();
  c.state='peck'; c.t=1.9;                   // 한 판 이겼으니 잠깐 쪼아본다
}
function updChickens(dt){
  for(const c of chickens){
    const pd=Math.hypot(c.x-player.x,c.z-player.z);
    const hd=Math.hypot(c.x-c.hx,c.z-c.hz);
    let moving=false, spd=0;

    if(c.state==='wander'){
      c.cluck-=dt;
      if(c.cluck<=0){ c.cluck=4+Math.random()*8; if(pd<420) cluckS(); }
      c.t-=dt;
      if(c.t<=0) pickWander(c);
      const d=moveToward(c,c.tx,c.tz,CHK_WANDER*dt);
      moving=true; spd=CHK_WANDER;
      if(d<12) pickWander(c);
      // 계란 든 놈이 눈앞에 있으면 바로 어그로
      if(held && pd<CHK_SIGHT_R){ c.state='chase'; c.react=CHK_REACT; squawkS(); }
    }
    else if(c.state==='chase'){
      if(c.react>0){ c.react-=dt; }
      else{
        const t=navTo(c,player.x,player.z);
        c.tx=t.x; c.tz=t.z;                // 보는 방향도 지금 쫓는 쪽이어야 한다
        moveToward(c,t.x,t.z,CHK_CHASE*dt);
        moving=true; spd=CHK_CHASE;
        if(pd<CHK_R+PLR_R+3 && player.invuln<=0 && phase==='play') onCaught(c);
      }
      c.t+=dt;
      if(c.t>0.9 && Math.random()<dt*0.7) squawkS();
      if(pd>CHK_GIVEUP || hd>CHK_LEASH || (!held && pd>170)){ c.state='return'; }
    }
    else if(c.state==='peck'){
      c.t-=dt;
      if(Math.random()<dt*4) cluckS();
      if(c.t<=0) c.state='return';
    }
    else{ // return — 나갔던 놈은 문으로 되돌아와야 한다
      const t=navTo(c,c.hx,c.hz);
      c.tx=t.x; c.tz=t.z;
      moveToward(c,t.x,t.z,CHK_WANDER*1.5*dt);
      moving=true; spd=CHK_WANDER*1.5;
      if(Math.hypot(c.x-c.hx,c.z-c.hz)<14){ c.state='wander'; pickWander(c); }
    }

    collideCircle(c);
    if(moving){
      const dx=c.tx-c.x, dz=c.tz-c.z;
      if(Math.hypot(dx,dz)>4){
        const want=Math.atan2(dx,dz);
        let diff=want-c.dir;
        while(diff>Math.PI) diff-=TAU;
        while(diff<-Math.PI) diff+=TAU;
        c.dir+=diff*Math.min(1,dt*9);
      }
      c.bob+=dt*(spd/8);
    }
  }
}

// ============================================================
//  플레이어
// ============================================================
function updPlayer(dt){
  if(phase!=='play') return;
  player.invuln=Math.max(0,player.invuln-dt);
  if(player.stun>0){
    player.stun-=dt;
    collideCircle(player);
    return;
  }
  let mx=0,mz=0;
  if(keys.has('KeyW'))mz--; if(keys.has('KeyS'))mz++;
  if(keys.has('KeyA'))mx--; if(keys.has('KeyD'))mx++;
  const run=keys.has('ShiftLeft')||keys.has('ShiftRight');
  let spd=(run?SPD_RUN:SPD_WALK)*(held?CARRY_MULT:1);
  if(mx||mz){
    const l=Math.hypot(mx,mz); mx/=l; mz/=l;
    const fx=-Math.sin(yaw), fz=-Math.cos(yaw);
    const rx=Math.cos(yaw),  rz=-Math.sin(yaw);
    const wx=fx*(-mz)+rx*mx, wz=fz*(-mz)+rz*mx;
    const wl=Math.hypot(wx,wz)||1;
    player.x+=wx/wl*spd*dt; player.z+=wz/wl*spd*dt;
    player.stepAcc+=spd*dt;
    if(player.stepAcc>=(run?52:42)){
      player.stepAcc=0; stepS(run);
      burst(player.x,2,player.z,2,COL_DUST,7,0.35,3);
    }
  } else player.stepAcc=Math.min(player.stepAcc,20);
  collideCircle(player);

  if(held){
    held.x=player.x; held.z=player.z; held.y=CARRY_H;
    if(inPad(player.x,player.z)){ const e=held; held=null; e.state='gone'; deliverEgg(e); }
  }
}

// ============================================================
//  진행
// ============================================================
function win(){
  phase='win';
  document.getElementById('winStats').innerHTML=
    '시간 '+stats.t.toFixed(1)+'초<br>깨뜨린 계란 '+stats.broken+'개 · 닭에게 잡힘 '+stats.caught+'번';
  document.getElementById('winOv').style.display='flex';
  document.getElementById('cross').style.display='none';
  document.getElementById('pw').style.display='none';
  document.exitPointerLock && document.exitPointerLock();
  winS();
}
function resetWorld(){
  player.x=SPAWN.x; player.z=SPAWN.z; player.stepAcc=0; player.stun=0; player.invuln=0;
  yaw=-Math.PI/2; pitch=0; held=null; charge=-1;
  for(const e of eggs){ e.state='gone'; e.nest=-1; e.mesh.visible=false; }
  for(let i=0;i<nests.length;i++){ nests[i].cd=0; spawnEggAt(i); }
  for(let i=0;i<chickens.length;i++){
    const c=chickens[i];
    c.x=c.hx; c.z=c.hz; c.state='wander'; c.react=0; c.t=0;
    c.m.alert.visible=false; pickWander(c);
  }
  for(const m of splats) m.visible=false;
  for(const m of deliveredMesh) m.visible=false;
  stats={t:0,broken:0,delivered:0,caught:0};
  drawSign();
  shake=0; flash=0;
  clearDots();
}
function start(){
  if(phase!=='title') return;
  phase='play';
  initAudio();
  if(AC&&AC.state==='suspended') AC.resume();
  resetWorld();
  document.getElementById('title').style.display='none';
  document.getElementById('cross').style.display='block';
  renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock();
}
function restart(){
  phase='play';
  resetWorld();
  document.getElementById('winOv').style.display='none';
  document.getElementById('cross').style.display='block';
  if(!locked) pauseEl.style.display='flex';
}
function paused(){ return phase==='play' && !locked; }

function update(dt){
  now+=dt; simT+=dt;
  if(paused()) return;
  if(phase==='play'){
    stats.t+=dt;
    if(charge>=0 && charge<THROW_CHARGE_T) charge=Math.min(THROW_CHARGE_T,charge+dt);
  }
  shake=Math.max(0,shake-dt*1.8);
  flash=Math.max(0,flash-dt*2.2);
  updPlayer(dt);
  updEggs(dt);
  updNests(dt);
  updChickens(dt);
}

// ============================================================
//  렌더
// ============================================================
const _fwd=new THREE.Vector3();
function camDist(dx,dz){
  // 3인칭 카메라가 벽을 뚫지 않게 평면에서 잘라낸다
  const l=Math.hypot(dx,dz);
  if(l<1e-4) return TP_DIST;
  const ux=dx/l, uz=dz/l;
  let best=TP_DIST;
  for(let k=0;k<walls.length;k++){
    const t=raySeg(player.x,player.z,ux,uz,walls[k]);
    if(t<best) best=t;
  }
  return Math.max(46,Math.min(TP_DIST,best-14));
}
function render(){
  if(phase==='title'){
    const t=now*0.14;
    camera.rotation.set(0,0,0);
    camera.position.set(W/2+Math.sin(t)*260, 330, H/2+380+Math.cos(t*0.7)*120);
    camera.lookAt(600,20,300);
  } else {
    const roll=player.stun>0 ? Math.sin((STUMBLE_T-player.stun)*7)*0.5*(player.stun/STUMBLE_T) : 0;
    const sink=player.stun>0 ? -26*(player.stun/STUMBLE_T) : 0;
    camera.rotation.y=yaw;
    camera.rotation.x=pitch+(player.stun>0?-0.5*(player.stun/STUMBLE_T):0);
    camera.rotation.z=roll;
    _fwd.set(0,0,-1).applyQuaternion(camera.quaternion);
    let cx=player.x, cz=player.z, cy=EYE+sink;
    if(camMode===1){
      const d=camDist(-_fwd.x,-_fwd.z);
      const rx=Math.cos(yaw), rz=-Math.sin(yaw);
      const side=TP_SIDE*Math.min(1,d/TP_DIST);   // 벽에 붙어 카메라가 당겨지면 오프셋도 줄인다
      cx=player.x-_fwd.x*d+rx*side; cz=player.z-_fwd.z*d+rz*side;
      cy=EYE+TP_UP-_fwd.y*d;
      if(cy<20) cy=20;
    }
    if(shake>0){
      cx+=(Math.random()-0.5)*11*shake; cz+=(Math.random()-0.5)*11*shake;
      cy+=(Math.random()-0.5)*7*shake;
    }
    camera.position.set(cx,cy,cz);
  }

  // 플레이어 몸 (3인칭에서만)
  plr.g.visible=(camMode===1 && phase!=='title');
  plr.g.position.set(player.x,0,player.z);
  plr.g.rotation.y=yaw;
  plr.g.rotation.z=player.stun>0?0.9*(player.stun/STUMBLE_T):0;
  // 계란을 들면 팔이 앞으로 나온다 — 3인칭에서 "지금 뭘 하고 있는지"가 몸으로 보여야 한다
  plr.a1.position.set(held?16:8,held?38:32, held?7:10);
  plr.a2.position.set(held?16:8,held?38:32, held?-7:-10);
  plr.a1.rotation.z=plr.a2.rotation.z=held?-Math.PI/2.6:0;

  // 계란 메시
  for(const e of eggs){
    if(e.state==='gone'||e.state==='held') { if(e.state!=='held') e.mesh.visible=false; continue; }
    e.mesh.visible=true;
    e.mesh.position.set(e.x,e.y,e.z);
    if(e.state==='fly'){ e.mesh.rotation.x=e.spin; e.mesh.rotation.z=e.spin*0.7; }
  }
  // 들고 있는 계란은 카메라 기준으로 손에 붙인다 (1인칭이면 화면 아래, 3인칭이면 몸 앞)
  if(held){
    held.mesh.visible=true;
    if(camMode===0){
      // 화면 오른쪽 아래에 "손에 든 것"만큼만 보이게 — 너무 가까우면 화면을 다 먹는다
      const rx=Math.cos(yaw), rz=-Math.sin(yaw);
      held.mesh.position.set(
        camera.position.x+_fwd.x*72+rx*26,
        camera.position.y+_fwd.y*72-32+Math.sin(now*7)*1.1,
        camera.position.z+_fwd.z*72+rz*26);
    } else {
      // 등 뒤 카메라에 몸통이 가리지 않도록 살짝 오른쪽 위로 들고 있는다
      const fx=-Math.sin(yaw), fz=-Math.cos(yaw);
      const rx=Math.cos(yaw),  rz=-Math.sin(yaw);
      held.mesh.position.set(player.x+fx*24+rx*11,
                             CARRY_H+10+Math.sin(now*7)*1.2,
                             player.z+fz*24+rz*11);
    }
    held.mesh.rotation.set(0,0,0);
  }

  // 닭
  for(const c of chickens){
    const m=c.m;
    m.g.position.set(c.x,Math.abs(Math.sin(c.bob))*2.5,c.z);
    m.g.rotation.y=c.dir-Math.PI/2;
    m.neck.rotation.z=(c.state==='peck')?-1.1+Math.sin(now*9)*0.35:Math.sin(c.bob)*0.18;
    m.l1.rotation.x=Math.sin(c.bob)*0.7;
    m.l2.rotation.x=-Math.sin(c.bob)*0.7;
    m.alert.visible=(c.state==='chase');
    if(m.alert.visible) m.alert.position.y=54+Math.abs(Math.sin(now*8))*7;
  }

  dotMat.uniforms.uTime.value=simT;
  flushDots();
  renderer.render(scene,camera);

  // HUD
  const hud=document.getElementById('hud');
  hud.innerHTML = phase==='title' ? '' :
    '<span class="big">계란 '+stats.delivered+' / '+NEED_EGGS+'</span><br>'+
    '시간 '+stats.t.toFixed(1)+'초 · 깨짐 '+stats.broken+' · 잡힘 '+stats.caught+
    ' · 시점 '+(camMode?'3인칭':'1인칭');

  const pr=document.getElementById('prompt');
  if(phase!=='play'){ pr.textContent=''; }
  else if(player.stun>0){ pr.textContent='넘어졌다…'; }
  else if(held){ pr.textContent='좌클릭 꾹 — 던지기 (흰 선 넘으면 깨진다) · E — 살살 내려놓기'; }
  else {
    let near=false;
    for(const e of eggs) if(e.state==='rest' && Math.hypot(e.x-player.x,e.z-player.z)<PICK_R){ near=true; break; }
    pr.textContent = near ? 'E — 계란 줍기' : '';
  }
  const pw=document.getElementById('pw');
  if(charge>=0 && held && phase==='play'){
    const f=charge/THROW_CHARGE_T;
    pw.style.display='block';
    const fill=document.getElementById('pwFill');
    fill.style.width=(f*100).toFixed(0)+'%';
    fill.style.background=(f>SAFE_FRAC)?'#e2564a':'#7bd77b';
  } else pw.style.display='none';
  document.getElementById('flash').style.opacity=(flash*0.42).toFixed(3);
}

// ============================================================
//  입력
// ============================================================
const titleEl=document.getElementById('title');
const pauseEl=document.getElementById('pauseOv');
document.getElementById('pwMark').style.left=(SAFE_FRAC*100).toFixed(1)+'%';
if(('ontouchstart' in window) && !matchMedia('(pointer:fine)').matches)
  document.getElementById('pcNote').style.display='block';
titleEl.addEventListener('click',start);
pauseEl.addEventListener('click',()=>{
  renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock();
});
document.addEventListener('pointerlockchange',()=>{
  locked=(document.pointerLockElement===renderer.domElement);
  if(phase==='play') pauseEl.style.display=locked?'none':'flex';
  if(!locked){ keys.clear(); charge=-1; }
});
document.addEventListener('mousemove',e=>{
  if(!locked||phase!=='play') return;
  yaw  -=e.movementX*0.0023;
  pitch-=e.movementY*0.0023;
  pitch=Math.max(-1.2,Math.min(1.2,pitch));
});
renderer.domElement.addEventListener('mousedown',e=>{
  if(phase!=='play'||!locked||e.button!==0) return;
  if(held && player.stun<=0) charge=0;
});
window.addEventListener('mouseup',e=>{
  if(e.button!==0) return;
  if(charge>=0){
    const pw=charge/THROW_CHARGE_T;
    charge=-1;
    if(phase==='play'&&held&&player.stun<=0) throwEgg(pw);
  }
});
window.addEventListener('keydown',e=>{
  if(e.code==='Space') e.preventDefault();
  if(phase==='title') return;                 // 타이틀은 클릭으로만 시작 (포인터록 제스처)
  if(e.code==='KeyR'){ restart(); return; }
  if(e.code==='KeyM'){ toggleMute(); return; }
  if(e.code==='KeyV'){ camMode=camMode?0:1; return; }
  if(e.code==='KeyE'){ tryPickOrPlace(); return; }
  keys.add(e.code);
});
window.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>{ keys.clear(); charge=-1; });

// ============================================================
//  루프
// ============================================================
resetWorld();
let last=performance.now();
function frame(ts){
  const dt=Math.min(0.05,(ts-last)/1000);
  last=ts;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
